name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every job here is read-only / local: no real DATABASE_URL, no deploys, no migrations applied.
# DATABASE_URL is a syntactically-valid but unreachable placeholder — `prisma generate` only reads
# the schema, and the test suite talks to an embedded Postgres (PGlite) or mocks @/lib/prisma, never
# a real database.
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand
